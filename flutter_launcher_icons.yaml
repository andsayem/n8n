# Regenerate with: node promo/icon.js && dart run flutter_launcher_icons
# This file takes precedence over the flutter_launcher_icons block in pubspec.yaml.
flutter_launcher_icons:
  image_path: "assets/icon/icon.png"

  android: "launcher_icon"
  min_sdk_android: 21 # android min sdk min:16, default 21
  adaptive_icon_background: "assets/icon/icon_bg.png"
  adaptive_icon_foreground: "assets/icon/icon_fg.png"
  # icon_fg.png is already sized for the adaptive safe zone (promo/icon.js).
  adaptive_icon_foreground_inset: 0

  ios: true
  remove_alpha_ios: true
