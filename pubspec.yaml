name: n8n_manager
description: A professional n8n automation server manager for mobile.
publish_to: 'none'
version: 1.2.3+20

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  get: ^4.6.6
  dio: ^5.4.0
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  shimmer: ^3.0.0
  fl_chart: ^0.66.2
  json_annotation: ^4.8.1
  connectivity_plus: ^5.0.2
  flutter_animate: ^4.5.0
  cached_network_image: ^3.3.1
  timeago: ^3.6.1
  google_fonts: ^6.2.1
  uuid: ^4.3.3
  flutter_launcher_icons: ^0.14.4
  google_mobile_ads: ^9.0.0
  url_launcher: ^6.3.2
  share_plus: ^12.0.2
  package_info_plus: ^9.0.1
  in_app_purchase: ^3.3.0
  flutter_easyloading: ^3.0.5
  upgrader: ^13.1.0
  flutter_riverpod: ^3.3.1
  flutter_local_notifications: ^21.0.0
  flutter_spinkit: ^5.2.2
  in_app_review: ^2.0.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  json_serializable: ^6.7.1
  change_app_package_name: ^1.5.0  

# Not used while flutter_launcher_icons.yaml exists (that file wins); kept in sync.
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "assets/icon/icon_bg.png"
  adaptive_icon_foreground: "assets/icon/icon_fg.png"
  remove_alpha_ios: true
  min_sdk_android: 21 # android min sdk min:16, default 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icon/
    - assets/mock/

